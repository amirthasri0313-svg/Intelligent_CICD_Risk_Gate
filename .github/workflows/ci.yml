name: Intelligent CI/CD Risk Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  risk-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          pytest

      - name: Change Analysis
        run: |
          python change_analyzer.py

      - name: Code Quality Check
        run: |
          python quality_check.py

      - name: Security Check
        run: |
          python security_check.py

      - name: Release Readiness
        run: |
          python release_readiness.py

      - name: Risk Gate
        run: |
          score=$(cat readiness_score.txt)

          echo "================================="
          echo "Release Readiness Score: $score"
          echo "================================="

          python risk_gate.py "$score"

      - name: Deployment Decision
        run: |
          score=$(cat readiness_score.txt)

          echo "================================="
          echo "DEPLOYMENT DECISION"
          echo "================================="

          if [ "$score" -ge 75 ]; then
            echo "LOW RISK - AUTO DEPLOY"
            python deploy.py

          elif [ "$score" -ge 50 ]; then
            echo "MEDIUM RISK - MANUAL APPROVAL REQUIRED"
            echo "Deployment will not run automatically."

          else
            echo "HIGH RISK - RELEASE BLOCKED"
            exit 1
          fi